
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

#issueTrackerURL="https://github.com/MrSky1/DiabolicalGamerules/issues" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

#displayURL="https://github.com/MrSky1/DiabolicalGamerules/tree/main" #optional

#logoFile="examplemod.png" #optional

#credits="" #optional

authors="ChatGPT (AI), MrSky1"

description='''
I couldn't find a default gamerule mod I was happy with, so I asked ChatGPT to make this for me. You can set new default gamerules with the use of one command ingame.
'''

[[mixins]]
config="diabolical_default_gamerules.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

